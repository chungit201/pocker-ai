name: Build and deploy

# Every push to main builds the image on a GitHub runner (the server is too small to
# build on), pushes it to GHCR, then asks the server to pull and restart it.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false   # never cut a deploy off half way

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name must be lower case
        run: echo "IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Baked into the browser bundle and the rewrite table, so they are needed at build time.
          # They are public values (Settings > Secrets and variables > Actions > Variables).
          build-args: |
            NEXT_PUBLIC_SUITED_SERVER=${{ vars.NEXT_PUBLIC_SUITED_SERVER }}
            NEXT_PUBLIC_SUITED_WS=${{ vars.NEXT_PUBLIC_SUITED_WS }}
            NEXT_PUBLIC_CHAIN_ID=${{ vars.NEXT_PUBLIC_CHAIN_ID }}
            NEXT_PUBLIC_CHAIN_RPC_URL=${{ vars.NEXT_PUBLIC_CHAIN_RPC_URL }}
            NEXT_PUBLIC_CHAIN_EXPLORER_URL=${{ vars.NEXT_PUBLIC_CHAIN_EXPLORER_URL }}
            NEXT_PUBLIC_SOLANA_RPC_URL=${{ vars.NEXT_PUBLIC_SOLANA_RPC_URL }}
            NEXT_PUBLIC_WALLETCONNECT_ID=${{ vars.NEXT_PUBLIC_WALLETCONNECT_ID }}
            SUITED_BACKEND=${{ vars.SUITED_BACKEND }}

      - name: Deploy on the server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "cd ~/pocker-ai && IMAGE=${IMAGE}:${GITHUB_SHA} docker compose pull web \
             && IMAGE=${IMAGE}:${GITHUB_SHA} docker compose up -d web \
             && docker image prune -f >/dev/null"

      - name: Health check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$SSH_USER@$SSH_HOST" "curl -fsS -o /dev/null http://127.0.0.1:3001/"; then
              echo "up"; exit 0
            fi
            sleep 3
          done
          echo "the new container did not answer on :3001; recent logs:" >&2
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$SSH_USER@$SSH_HOST" "cd ~/pocker-ai && docker compose logs web --tail 30" >&2
          exit 1
